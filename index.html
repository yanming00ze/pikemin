<style>


*{

margin:0;
padding:0;
box-sizing:border-box;

}



body{


font-family:
"Noto Sans TC",
"Microsoft JhengHei",
sans-serif;


min-height:100vh;


display:flex;

align-items:center;

justify-content:center;


padding:20px;


background:

url("pikmin.jpg")

center/cover fixed;


position:relative;

overflow:hidden;


}



/* 背景遮罩 */


body::before{


content:"";


position:absolute;

inset:0;


background:

linear-gradient(

180deg,

rgba(255,255,220,.35),

rgba(255,255,255,.65)

);


backdrop-filter:blur(2px);


}



/* 花瓣 */


.petal{


position:absolute;

width:13px;

height:13px;


background:

linear-gradient(

135deg,

#ffd5df,

#ff8cac

);


border-radius:100% 0;


animation:fall linear infinite;


opacity:.7;


}



@keyframes fall{


from{

transform:

translateY(-20vh)

rotate(0deg);

}


to{

transform:

translateY(120vh)

rotate(360deg);

}


}



/* 主活動卡 */


.card{


width:100%;

max-width:430px;


padding:35px 28px 30px;


background:

rgba(255,255,255,.68);


border-radius:30px;


position:relative;

z-index:2;


text-align:center;



border:

1px solid rgba(255,255,255,.8);



box-shadow:


0 20px 60px

rgba(80,120,50,.25);



backdrop-filter:

blur(15px);



animation:

show .8s ease;


}



@keyframes show{


from{

opacity:0;

transform:

translateY(30px);

}


to{

opacity:1;

transform:none;

}


}




/* Logo */


.logo-box{


width:125px;

height:125px;


margin:auto;


padding:6px;


border-radius:50%;


background:

linear-gradient(

135deg,

#ffe600,

#7bd65a

);


box-shadow:


0 0 35px

rgba(255,220,0,.5);


}



.logo-box img{


width:100%;

height:100%;


object-fit:cover;


border-radius:50%;


}




/* 標題 */


.title{


margin-top:22px;


font-size:38px;


font-weight:900;


color:#315d18;



text-shadow:

0 3px 10px white;


}




.subtitle{


margin-top:8px;


font-size:18px;


font-weight:700;


color:#568443;


}




/* 活動區 */


.event-box{


margin-top:25px;


padding:18px;


border-radius:20px;



background:

rgba(255,255,255,.7);



box-shadow:


inset 0 0 20px rgba(100,150,80,.1);



}



.event-title{


font-size:20px;

font-weight:900;

color:#426d20;


}



.event-text{


margin-top:8px;


font-size:14px;


color:#66835a;


line-height:1.8;


}



/* 按鈕 */


.button{


margin-top:25px;


display:block;


padding:17px;


border-radius:50px;



background:

linear-gradient(

180deg,

#ffe900,

#ffc400

);



color:#385500;


font-size:20px;


font-weight:900;


text-decoration:none;


box-shadow:


0 7px 0 #d99e00,

0 12px 25px rgba(255,190,0,.45);



transition:.25s;


}



.button:hover{


transform:

translateY(-3px);


}




.footer{


margin-top:22px;


font-size:12px;


color:#71836a;


}




@media(max-width:480px){


.title{

font-size:32px;

}


.card{

padding:30px 20px;

}


}


</style>


</head>
